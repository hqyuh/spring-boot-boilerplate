jwt:
    secret: '[a-zA-Z0-9._]^+$Guidelines89797987forAlphabeticalArrNumberSym$^@GHJ@YUH@HQH'
logging:
    file:
        name: logs/gts.log
    pattern:
        console: '%d{yyyy-MMM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{15} - %msg%n'
        file: '%d{yyyy-MMM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{15} - %msg%n'
    level:
        com:
            hqh: debug
        root: warn
    logback:
        rollingpolicy:
            clean-history-on-start: true
            file-name-pattern: logs/gts-%d{yyyy-MM-dd}.%i.log
            max-file-size: 100KB
            max-history: 14
            total-size-cap: 1MB
mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: com.hqh.boilerplate.entity
    configuration:
        map-underscore-to-camel-case: true
server:
    error:
        path: /error
    port: 9090
    servlet:
        context-path: /api/v1
spring:
    datasource:
        password: 123456
        url: jdbc:postgresql://localhost:5432/quiz
        username: postgres
    flyway:
        enabled: true
        baseline-on-migrate: true
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
        show-sql: true
    mail:
        host: smtp.gmail.com
        password: 
        port: 587
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
        username: hoquang.huyy@gmail.com
    main:
        allow-circular-references: true
    servlet:
        multipart:
            max-file-size: 2MB
            max-request-size: 2MB
    sql:
        init:
            mode: always
